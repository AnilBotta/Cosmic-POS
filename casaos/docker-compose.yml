name: cosmic-pos

services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmic-pos-postgres
    hostname: cosmic-pos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cosmic
      POSTGRES_PASSWORD: "please-change-this-password"
      POSTGRES_DB: cosmic_pos
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres
        target: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cosmic"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cosmic-pos

  backend:
    image: ghcr.io/anilbotta/cosmic-pos-backend:1.0.0
    container_name: cosmic-pos-backend
    hostname: cosmic-pos-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql://cosmic:please-change-this-password@cosmic-pos-postgres:5432/cosmic_pos"
      # No JWT_SECRET here on purpose — the app generates a real random one
      # itself on first boot and persists it to the /data/state volume
      # below (see apps/backend/src/main.ts's resolveJwtSecret()). A
      # hardcoded placeholder here would either be a real security hole
      # (most CasaOS installers never change it) or, since a later backend
      # update made the app refuse to boot with a known placeholder value,
      # a broken install out of the box — this way nobody ever has to
      # touch it and it still works correctly.
      JWT_EXPIRES_IN: "12h"
      PORT: "4000"
      CORS_ORIGIN: "http://localhost:1995"
      COOKIE_SECURE: "false"
      UPLOADS_DIR: "/data/uploads"
      # Spain VERI*FACTU producer identifier (see docs/verifactu.md). Only needed for Spanish installs.
      VERIFACTU_PRODUCER_ID: ""
      # Set to a long random key to make this server the sync hub for Windows
      # PCs (Settings > Server Sync). Empty = sync server off.
      SYNC_API_KEY: ""
      # In-app "Update now" button (Settings > Updates) -> the updater below.
      UPDATER_URL: "http://cosmic-pos-updater:8080"
      UPDATER_TOKEN: "cosmic-pos-updater"
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/uploads
        target: /data/uploads
      - type: bind
        source: /DATA/AppData/$AppID/state
        target: /data/state
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - cosmic-pos
    x-casaos:
      envs:
        - container: DATABASE_URL
          description:
            en_US: Must match the Postgres password below if you change it. Leave as default unless you know why you're changing it.
        - container: CORS_ORIGIN
          description:
            en_US: Origin allowed to call the API (CORS). Leave as the default for local/LAN use — only change for a VPS behind real HTTPS.
        - container: VERIFACTU_PRODUCER_ID
          description:
            en_US: Spain only. The software producer's identifier for VERI*FACTU records (at most 20 characters). Leave empty outside Spain.
        - container: COOKIE_SECURE
          description:
            en_US: Set to true only when served over real HTTPS. Leave false for plain local/LAN use — a true value on plain HTTP silently breaks login (the session cookie gets dropped by the browser).
      volumes:
        - container: /data/uploads
          description:
            en_US: Uploaded images (menu items, staff avatars, etc.) — back this up.
        - container: /data/state
          description:
            en_US: Auto-generated login security key. Created automatically on first launch — leave it alone.

  web:
    image: ghcr.io/anilbotta/cosmic-pos-web:1.0.0
    container_name: cosmic-pos-web
    hostname: cosmic-pos-web
    restart: unless-stopped
    ports:
      - target: 3000
        published: "1995"
        protocol: tcp
    depends_on:
      - backend
    networks:
      - cosmic-pos
    x-casaos:
      ports:
        - container: "3000"
          description:
            en_US: Cosmic POS web interface
          protocol: tcp

  # In-app "Update now" (Settings > Updates): pulls the newer Cosmic POS
  # images above and recreates those two containers (nothing else). Needs the
  # Docker socket to do that; data in /DATA/AppData is untouched. The updater
  # image is generic (it only manages the containers named below); it is
  # built from this repo's updater/ directory.
  updater:
    image: ghcr.io/anilbotta/cosmic-pos-updater:latest
    container_name: cosmic-pos-updater
    hostname: cosmic-pos-updater
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: "cosmic-pos-updater"
      TARGET_CONTAINERS: "cosmic-pos-backend,cosmic-pos-web"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - cosmic-pos
    x-casaos:
      volumes:
        - container: /var/run/docker.sock
          description:
            en_US: Docker socket, used only by the in-app "Update now" button to move the two Cosmic POS containers to a newer version.

networks:
  cosmic-pos:
    driver: bridge

x-casaos:
  id: com.syncai.cosmicpos
  architectures:
    - amd64
    - arm64
  main: web
  author: SyncAi Technologies
  developer: AnilBotta
  category: Finance
  icon: https://cdn.jsdelivr.net/gh/AnilBotta/Cosmic-POS@main/casaos/icon.png
  thumbnail: https://cdn.jsdelivr.net/gh/AnilBotta/Cosmic-POS@main/casaos/thumbnail.png
  screenshot_link:
    - https://cdn.jsdelivr.net/gh/AnilBotta/Cosmic-POS@main/casaos/screenshot-1.png
    - https://cdn.jsdelivr.net/gh/AnilBotta/Cosmic-POS@main/casaos/screenshot-2.png
    - https://cdn.jsdelivr.net/gh/AnilBotta/Cosmic-POS@main/casaos/screenshot-3.png
  title:
    en_US: Cosmic POS
  tagline:
    en_US: Offline-first restaurant management — POS, kitchen display, tables, and reservations
  description:
    en_US: |
      Cosmic POS is a free, open-source restaurant management system:
      point-of-sale ordering, a live kitchen display (KDS) split by station,
      table/floor management with QR-code table ordering, reservations and a
      waitlist, inventory with automatic ingredient deduction, customer CRM
      with loyalty points and gift cards, and full billing (splits, tips,
      discounts, refunds). Runs entirely on your own hardware — no
      subscription, no data leaving your server.

      Access it from any device on your home network at
      `http://<your-server>:1995` — a till, a waiter's tablet, or the
      kitchen's own display.
  tips:
    before_install:
      en_US: |
        Login security is handled automatically — no setup needed there.

        **Before anything beyond a quick local trial**, change the
        placeholder Postgres password: it must be changed identically in
        both the `postgres` service's `POSTGRES_PASSWORD` and the
        `backend` service's `DATABASE_URL`. Leaving the default is not
        safe for a real installation.

        Your data (Postgres database + uploaded images) persists at
        `/DATA/AppData/cosmic-pos/`, following CasaOS/ZimaOS's
        standard backup/restore convention.

        After install, sign up for a new restaurant account from the app's
        `/signup` page — no manual configuration or demo data needed.
  index: /
  scheme: http
  port_map: "1995"
  version: "1.0.0"
  update_at: "2026-10-28"
  release_notes:
    en_US: |-
      1.0.0: first Cosmic POS release, crafted by SyncAi Technologies.
      Based on Nodedr OrderRestro 1.9.0 (AGPL-3.0), rebranded as Cosmic POS.
  website: "https://github.com/AnilBotta/Cosmic-POS"
  repo: "https://github.com/AnilBotta/Cosmic-POS"
  support: "https://github.com/AnilBotta/Cosmic-POS/issues"
  docs: "https://github.com/AnilBotta/Cosmic-POS#readme"
